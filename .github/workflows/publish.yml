name: Publish to VS Code Marketplace

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run vscode:prepublish

      - name: Get OIDC token for VS Code Marketplace
        id: oidc
        uses: actions/id-token-request@v1
        with:
          audience: 'api://vscode-marketplace.visualstudio.com'

      - name: Package and Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ steps.oidc.outputs.token }}
        run: |
          npx vsce package
          npx vsce publish
