name: Publish to VS Code Marketplace

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package to Marketplace
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: marketplace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Validate release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "$RELEASE_TAG" = "v$(jq -r .version package.json)"
      - name: Package extension
        run: npx --yes @vscode/vsce@4.1.1 package --out file-lens.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: file-lens-vsix
          path: file-lens.vsix
      - name: Publish using Trusted Publishing
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master')
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --packagePath file-lens.vsix
